[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "A leakage-aware, time-ordered fraud detection project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "scipy>=1.11",
    "streamlit>=1.40",
    "plotly>=5.20",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fraud_detection*"]
